<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>README asset preview</title>
<!--
  The two README images at the exact widths the README sets them, on both of
  GitHub's canvas colours. This is the only way to check the thing the encoder
  has to get right: overlay-live.gif is flattened onto #0d1117, so it should
  disappear into the dark theme and still read as a deliberate screenshot of a
  dark app on the light one.

  Open it directly -- file:// is fine, there is nothing to serve.

  Deliberately contains NO copy of the README's prose. The version this replaced
  was a hand-maintained HTML transcription of the README, and by the time anyone
  looked at it again it was two rewrites out of date and pointing at six images
  that no longer existed.
-->
<style>
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  /* The README column on github.com is ~1012px wide; nothing may exceed it. */
  section { padding:40px; max-width:1012px; }
  .dark  { background:#0d1117; color:#e6edf3; }
  .light { background:#ffffff; color:#1f2328; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.55; margin:0 0 24px; font-weight:600; }
  figure { margin:0 0 32px; }
  figcaption { font-size:12px; opacity:.55; margin-top:8px; font-family:ui-monospace,Consolas,monospace; }
</style></head><body>

<section class="dark">
  <h2>Dark canvas &mdash; #0d1117</h2>
  <figure>
    <img src="../overlay-live.gif" width="406" alt="">
    <figcaption>overlay-live.gif @ width=406 (2x capture)</figcaption>
  </figure>
  <figure>
    <img src="../overlay-moment.gif" width="450" alt="">
    <figcaption>overlay-moment.gif @ width=450 (1x, native)</figcaption>
  </figure>
  <figure>
    <img src="../overlay-tiers.png" width="820" alt="">
    <figcaption>overlay-tiers.png @ width=820</figcaption>
  </figure>
</section>

<section class="light">
  <h2>Light canvas &mdash; #ffffff</h2>
  <figure>
    <img src="../overlay-live.gif" width="406" alt="">
    <figcaption>overlay-live.gif @ width=406 (2x capture)</figcaption>
  </figure>
  <figure>
    <img src="../overlay-moment.gif" width="450" alt="">
    <figcaption>overlay-moment.gif @ width=450 (1x, native)</figcaption>
  </figure>
  <figure>
    <img src="../overlay-tiers.png" width="820" alt="">
    <figcaption>overlay-tiers.png @ width=820</figcaption>
  </figure>
</section>

</body></html>
