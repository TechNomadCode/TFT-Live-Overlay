name: Release

# Builds the installers on each target OS and uploads them to a GitHub Release,
# so users get a double-click download instead of having to clone and build.
# electron-builder cannot cross-compile these (Windows NSIS from Linux needs
# Wine, and macOS builds only run on macOS), hence one job per platform.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder names the artifacts and the release tag from
  # package.json's version, not from the git tag. If the two drift, the tag
  # you pushed and the release you get back have different numbers on them.
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

  release:
    needs: [check-version]
    # workflow_dispatch skips check-version, which would otherwise block this.
    if: always() && needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            electron-cache: ~\AppData\Local\electron
          - os: macos-latest
            target: --mac
            electron-cache: ~/Library/Caches/electron
          - os: ubuntu-latest
            target: --linux
            electron-cache: ~/.cache/electron
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache }}
          key: ${{ matrix.os }}-electron-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci

      # --publish always creates (or reuses) a *draft* release for this
      # version and attaches the artifacts; the three jobs all upload into the
      # same draft. Publishing it is a manual step, so nothing goes public
      # until all three platforms have landed.
      - name: Build and publish
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
